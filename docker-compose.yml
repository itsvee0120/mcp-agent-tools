services:
  app:
    build: .
    ports:
      - "8501:8501"
    # Secrets are injected at runtime from your local .env (never baked into the image).
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
